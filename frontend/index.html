<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus CMO — Your Personal Social CMO Network</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #070707;
            --bg-card: #111214;
            --bg-elevated: #151619;
            --border: #2a2a2d;
            --border-light: #3f3f46;
            --text: #fafafa;
            --text-dim: #a1a1aa;
            --text-muted: #71717a;
            
            --accent: #2563eb; /* deep electric blue */
            --accent-dim: #4338ca; /* indigo */
            --accent-glow: rgba(37, 99, 235, 0.4);
            
            --glow-orange: rgba(234, 88, 12, 0.15); /* warm atmospheric glow */
            
            --linkedin: #0a66c2;
            --instagram: #e4405f;
            --twitter: #000000;
            
            --success: #22c55e;
            --warning: #eab308;
            --danger: #ef4444;
            
            --radius: 12px;
            --radius-lg: 16px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg-dark);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Cinematic Background */
        .cinematic-bg {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at 50% -20%, var(--glow-orange), transparent 50%),
                        radial-gradient(ellipse at 50% 100%, rgba(37, 99, 235, 0.05), transparent 70%);
            pointer-events: none;
            z-index: -1;
        }
        
        .cinematic-bg::after {
            content: '';
            position: absolute;
            inset: 0;
            background-image: url('data:image/svg+xml,%3Csvg viewBox=%220 0 200 200%22 xmlns=%22http://www.w3.org/2000/svg%22%3E%3Cfilter id=%22noiseFilter%22%3E%3CfeTurbulence type=%22fractalNoise%22 baseFrequency=%220.65%22 numOctaves=%223%22 stitchTiles=%22stitch%22/%3E%3C/filter%3E%3Crect width=%22100%25%22 height=%22100%25%22 filter=%22url(%23noiseFilter)%22 opacity=%220.03%22/%3E%3C/svg%3E');
        }

        .app { display: flex; min-height: 100vh; position: relative; z-index: 1; }

        /* Sidebar */
        .sidebar {
            width: 280px;
            background: rgba(17, 18, 20, 0.8);
            backdrop-filter: blur(20px);
            border-right: 1px solid var(--border);
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            position: fixed;
            height: 100vh;
            overflow-y: auto;
            z-index: 100;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 8px 12px;
            margin-bottom: 8px;
        }

        .logo h1 {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 1px;
            background: linear-gradient(135deg, #fff 30%, var(--accent-dim) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .tagline {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-dim);
            padding: 0 12px;
            margin-bottom: 32px;
        }

        .nav-group { margin-bottom: 28px; }
        
        .nav-label {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: var(--text-muted);
            padding: 0 12px;
            margin-bottom: 12px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 10px 14px;
            border-radius: 8px;
            cursor: pointer;
            color: var(--text-dim);
            transition: all 0.2s ease;
            margin-bottom: 4px;
            font-weight: 500;
            font-size: 14px;
        }

        .nav-item:hover {
            background: var(--bg-elevated);
            color: var(--text);
        }

        .nav-item.active {
            background: rgba(37, 99, 235, 0.1);
            color: #fff;
        }

        .nav-item.active::before {
            content: '';
            position: absolute;
            left: 0;
            width: 3px;
            height: 20px;
            background: var(--accent);
            border-radius: 0 4px 4px 0;
        }

        .nav-icon { font-size: 18px; width: 24px; text-align: center; font-weight: 300; }

        /* Main Content */
        .main {
            flex: 1;
            margin-left: 280px;
            padding: 40px;
            max-width: 1400px;
        }
        
        .main.landing-mode {
            margin-left: 0;
            padding: 0;
            max-width: 100%;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }

        .page-title {
            font-size: 28px;
            font-weight: 600;
            letter-spacing: -0.5px;
        }

        /* Buttons */
        .btn {
            padding: 12px 24px;
            border-radius: 8px;
            border: none;
            font-family: inherit;
            font-weight: 500;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-primary {
            background: var(--accent);
            color: white;
            box-shadow: 0 4px 20px rgba(37, 99, 235, 0.3);
        }

        .btn-primary:hover {
            background: var(--accent-dim);
            transform: translateY(-1px);
            box-shadow: 0 6px 24px rgba(37, 99, 235, 0.4);
        }

        .btn-secondary {
            background: var(--bg-elevated);
            color: var(--text);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background: var(--border);
        }

        .btn-danger {
            background: rgba(239, 68, 68, 0.1);
            color: var(--danger);
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        .btn-linkedin { background: var(--linkedin); color: white; }
        .btn-instagram { background: var(--instagram); color: white; }
        .btn-twitter { background: var(--bg-card); color: white; border: 1px solid var(--border); }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        /* Cards */
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 28px;
            margin-bottom: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .card-title {
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 0.5px;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
            text-transform: uppercase;
            color: var(--text-dim);
        }

        /* Executive Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 24px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 24px;
            display: flex;
            flex-direction: column;
        }

        .stat-label { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); margin-bottom: 12px; }
        .stat-value { font-size: 32px; font-weight: 500; letter-spacing: -1px; }
        .stat-sub { font-size: 12px; color: var(--success); margin-top: auto; padding-top: 12px; }

        /* Grid Layout */
        .grid-2 { display: grid; grid-template-columns: 1.2fr 1fr; gap: 24px; }
        .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }

        /* Landing / Hero */
        .hero-section {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 15vh;
            text-align: center;
            position: relative;
        }

        .hero-title {
            font-size: 64px;
            font-weight: 700;
            letter-spacing: -2px;
            line-height: 1.1;
            margin-bottom: 24px;
            background: linear-gradient(180deg, #fff 0%, #a1a1aa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-subtitle {
            font-size: 18px;
            color: var(--text-dim);
            max-width: 600px;
            line-height: 1.6;
            margin-bottom: 48px;
        }
        
        .hero-horizon {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 400px;
            background: radial-gradient(ellipse at center 100%, var(--glow-orange) 0%, transparent 70%);
            z-index: 0;
            pointer-events: none;
        }
        
        .product-preview {
            width: 90%;
            max-width: 1200px;
            height: 600px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 24px 24px 0 0;
            box-shadow: 0 -20px 60px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.05) inset;
            position: relative;
            z-index: 10;
            overflow: hidden;
            display: flex;
            transform: perspective(1000px) rotateX(2deg);
            transform-origin: bottom center;
        }
        
        .preview-sidebar {
            width: 240px;
            border-right: 1px solid var(--border);
            background: var(--bg-elevated);
            padding: 20px;
        }
        
        .preview-content {
            flex: 1;
            padding: 32px;
            background: var(--bg-dark);
            opacity: 0.7;
        }

        /* Opportunity Radar */
        .radar-score-container {
            display: flex;
            align-items: center;
            gap: 40px;
            margin-bottom: 32px;
        }
        .radar-circle {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle, rgba(37, 99, 235, 0.1) 0%, transparent 70%);
            border: 2px solid var(--accent);
            box-shadow: 0 0 30px rgba(37,99,235,0.2);
        }
        .radar-score { font-size: 36px; font-weight: 700; color: #fff; }
        .radar-label { font-size: 12px; font-weight: 600; color: var(--accent); text-transform: uppercase; letter-spacing: 1px; }
        
        .factor-list { flex: 1; display: flex; flex-direction: column; gap: 16px; }
        .factor-item { display: flex; flex-direction: column; gap: 8px; }
        .factor-header { display: flex; justify-content: space-between; font-size: 13px; color: var(--text-dim); }
        .factor-bar-bg { height: 6px; background: var(--bg-elevated); border-radius: 3px; overflow: hidden; }
        .factor-bar-fill { height: 100%; background: var(--accent); border-radius: 3px; }

        /* Agent Network */
        .agent-network {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            position: relative;
        }
        
        .agent-line {
            position: absolute;
            top: 50%;
            left: 40px;
            right: 40px;
            height: 2px;
            background: var(--border);
            z-index: 0;
        }
        
        .agent-node {
            position: relative;
            z-index: 1;
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            padding: 16px;
            border-radius: 12px;
            text-align: center;
            width: 140px;
            transition: all 0.3s;
        }
        
        .agent-node.active {
            border-color: var(--accent);
            box-shadow: 0 0 20px rgba(37, 99, 235, 0.2);
            transform: translateY(-5px);
        }
        
        .agent-name { font-size: 13px; font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase; margin-bottom: 4px; }
        .agent-role { font-size: 11px; color: var(--text-dim); margin-bottom: 12px; }
        .agent-status { font-size: 10px; padding: 4px 8px; border-radius: 10px; display: inline-block; }
        
        .status-active { background: rgba(37, 99, 235, 0.1); color: #60a5fa; }
        .status-ready { background: rgba(255,255,255,0.05); color: var(--text-muted); }
        
        /* Form Elements */
        .form-group { margin-bottom: 24px; }

        .form-label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-dim);
            margin-bottom: 10px;
        }

        .form-input, .form-textarea, .form-select {
            width: 100%;
            padding: 14px 16px;
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-family: inherit;
            font-size: 14px;
            transition: all 0.2s ease;
        }

        .form-input:focus, .form-textarea:focus, .form-select:focus {
            outline: none;
            border-color: var(--accent);
            background: var(--bg-dark);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .form-textarea { min-height: 120px; resize: vertical; }

        /* Platform Pills */
        .platform-pills { display: flex; gap: 12px; margin-bottom: 24px; }

        .platform-pill {
            flex: 1;
            padding: 16px 20px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--bg-elevated);
            color: var(--text-dim);
            font-family: inherit;
            font-weight: 500;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .platform-pill:hover { border-color: var(--border-light); background: var(--bg-dark); }
        
        .platform-pill.active { border-color: var(--accent); color: white; background: rgba(37,99,235,0.1); }

        /* Content Type Tabs */
        .content-tabs {
            display: flex;
            gap: 4px;
            background: var(--bg-elevated);
            padding: 4px;
            border-radius: 8px;
            margin-bottom: 24px;
            border: 1px solid var(--border);
        }

        .content-tab {
            flex: 1;
            padding: 10px 16px;
            border: none;
            background: transparent;
            color: var(--text-dim);
            font-family: inherit;
            font-weight: 500;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.2s ease;
            font-size: 13px;
        }

        .content-tab.active { background: var(--bg-card); color: var(--text); box-shadow: 0 2px 8px rgba(0,0,0,0.2); }

        /* Posts */
        .post-item {
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 16px;
            transition: all 0.2s ease;
        }
        .post-item:hover { border-color: var(--border-light); transform: translateY(-2px); }
        .post-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; }
        .badge { padding: 6px 12px; border-radius: 6px; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
        .badge.linkedin { background: rgba(10, 102, 194, 0.1); color: var(--linkedin); border: 1px solid rgba(10, 102, 194, 0.3); }
        .badge.instagram { background: rgba(228, 64, 95, 0.1); color: var(--instagram); border: 1px solid rgba(228, 64, 95, 0.3); }
        .badge.twitter { background: rgba(255, 255, 255, 0.05); color: var(--text); border: 1px solid var(--border); }
        .badge.draft { background: rgba(255, 255, 255, 0.05); color: var(--text-dim); }
        .badge.scheduled { background: rgba(139, 92, 246, 0.1); color: #a78bfa; }
        .badge.publishing { background: rgba(234, 179, 8, 0.1); color: var(--warning); }
        .badge.published { background: rgba(34, 197, 94, 0.1); color: var(--success); }
        .post-content { font-size: 14px; color: var(--text-dim); line-height: 1.6; }
        .post-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; padding-top: 20px; border-top: 1px solid var(--border); }
        
        /* Modals & Loaders */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.85); display: flex; align-items: center; justify-content: center; z-index: 1000; backdrop-filter: blur(8px); }
        .modal { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-lg); width: 90%; max-width: 500px; padding: 32px; box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
        .spinner { width: 18px; height: 18px; border: 2px solid rgba(255,255,255,0.2); border-top-color: #fff; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); }

        @media (max-width: 1024px) { .grid-2 { grid-template-columns: 1fr; } .grid-3 { grid-template-columns: 1fr; } }
        @media (max-width: 768px) { .sidebar { display: none; } .main { margin-left: 0; padding: 20px; } }
</style>
</head>

        // Video/Reel Maker
        function VideoMaker({ onCreated }) {
            const [mode, setMode] = useState('reel'); // reel, text_to_video, image_to_video
            const [topic, setTopic] = useState('');
            const [prompt, setPrompt] = useState('');
            const [style, setStyle] = useState('engaging');
            const [duration, setDuration] = useState(5);
            const [aspectRatio, setAspectRatio] = useState('9:16');
            const [platform, setPlatform] = useState('instagram');
            const [instructions, setInstructions] = useState('');
            const [loading, setLoading] = useState(false);
            const [result, setResult] = useState(null);
            const [videoStatus, setVideoStatus] = useState(null);
            const [polling, setPolling] = useState(false);

            const styles = [
                { id: 'engaging', label: '🔥 Engaging', desc: 'Hook viewers fast' },
                { id: 'educational', label: '📚 Educational', desc: 'Teach something' },
                { id: 'funny', label: '😂 Funny', desc: 'Make them laugh' },
                { id: 'dramatic', label: '🎭 Dramatic', desc: 'Create emotion' },
            ];

            const generateReel = async () => {
                if (!topic) return;
                setLoading(true);
                setResult(null);
                setVideoStatus(null);

                try {
                    const res = await api.post('/generate-reel', {
                        topic,
                        style,
                        duration,
                        platform,
                        custom_instructions: instructions
                    });

                    if (res.success) {
                        setResult(res.reel);
                        // Start polling for video status
                        if (res.reel.video_task_id) {
                            pollVideoStatus(res.reel.video_task_id);
                        }
                    } else {
                        alert('Failed: ' + (res.error || 'Unknown error'));
                    }
                } catch (err) {
                    alert('Generation failed. Check your API keys.');
                }
                setLoading(false);
            };

            const generateVideo = async () => {
                if (!prompt) return;
                setLoading(true);
                setResult(null);
                setVideoStatus(null);

                try {
                    const res = await api.post('/generate-video', {
                        prompt,
                        video_type: mode,
                        duration,
                        aspect_ratio: aspectRatio,
                        mode: 'std',
                        platform
                    });

                    if (res.success) {
                        setResult({ video_task_id: res.task_id });
                        pollVideoStatus(res.task_id);
                    } else {
                        alert('Failed: ' + (res.error || 'Unknown error'));
                    }
                } catch (err) {
                    alert('Generation failed. Check your Kling API key.');
                }
                setLoading(false);
            };

            const pollVideoStatus = async (taskId) => {
                setPolling(true);
                const maxAttempts = 60; // 5 minutes max
                let attempts = 0;

                const poll = async () => {
                    try {
                        const res = await api.get(`/video-status/${taskId}`);
                        setVideoStatus(res);

                        if (res.status === 'completed' || res.status === 'success') {
                            setPolling(false);
                            return;
                        } else if (res.status === 'failed' || res.status === 'error') {
                            setPolling(false);
                            return;
                        }

                        attempts++;
                        if (attempts < maxAttempts) {
                            setTimeout(poll, 5000); // Poll every 5 seconds
                        } else {
                            setPolling(false);
                        }
                    } catch (err) {
                        setPolling(false);
                    }
                };

                poll();
            };

            return (
                <div>
                    <div className="header">
                        <h1 className="page-title">🎬 Video & Reel Maker</h1>
                    </div>

                    <div className="grid-2">
                        <div className="card">
                            <div className="card-title">✨ AI Video Generator</div>
                            <p style={{ color: 'var(--text-muted)', marginBottom: '20px', fontSize: '13px' }}>
                                Powered by Kling AI (~$0.10/video)
                            </p>

                            <div className="form-label">Generation Mode</div>
                            <div className="content-tabs" style={{ marginBottom: '20px' }}>
                                <button className={`content-tab ${mode === 'reel' ? 'active' : ''}`} onClick={() => setMode('reel')}>
                                    📱 Auto Reel
                                </button>
                                <button className={`content-tab ${mode === 'text_to_video' ? 'active' : ''}`} onClick={() => setMode('text_to_video')}>
                                    ✍️ Text → Video
                                </button>
                            </div>

                            {mode === 'reel' ? (
                                <>
                                    <div className="form-label">Platform</div>
                                    <div className="platform-pills" style={{ marginBottom: '20px' }}>
                                        <button className={`platform-pill ${platform === 'instagram' ? 'active instagram' : ''}`} onClick={() => setPlatform('instagram')}>
                                            📸 Instagram
                                        </button>
                                        <button className={`platform-pill ${platform === 'tiktok' ? 'active' : ''}`} onClick={() => setPlatform('tiktok')} style={{ borderColor: platform === 'tiktok' ? '#ff0050' : '' }}>
                                            🎵 TikTok
                                        </button>
                                    </div>

                                    <div className="form-group">
                                        <label className="form-label">Topic</label>
                                        <input type="text" className="form-input" placeholder="e.g., 3 morning habits that changed my life" value={topic} onChange={e => setTopic(e.target.value)} />
                                    </div>

                                    <div className="form-label">Style</div>
                                    <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '8px', marginBottom: '20px' }}>
                                        {styles.map(s => (
                                            <button key={s.id} onClick={() => setStyle(s.id)} style={{
                                                padding: '10px', borderRadius: '8px', cursor: 'pointer', textAlign: 'left',
                                                border: style === s.id ? '2px solid var(--accent)' : '1px solid var(--border)',
                                                background: style === s.id ? 'rgba(139,92,246,0.1)' : 'transparent', color: 'var(--text)'
                                            }}>
                                                <div style={{ fontWeight: '600', fontSize: '13px' }}>{s.label}</div>
                                                <div style={{ fontSize: '11px', color: 'var(--text-muted)' }}>{s.desc}</div>

                                        <textarea className="form-textarea" placeholder="Specific requirements, brand voice..." value={instructions} onChange={e => setInstructions(e.target.value)} style={{ minHeight: '60px' }} />

        // Avatar Video Maker
        function AvatarMaker({ onCreated }) {
            const [step, setStep] = useState(1); // 1: Upload photo, 2: Add script, 3: Generate

            const [photoPreview, setPhotoPreview] = useState(null);
            const [photoUrl, setPhotoUrl] = useState('');
            const [scriptMode, setScriptMode] = useState('generate'); // generate, write, upload_audio
            const [topic, setTopic] = useState('');
            const [script, setScript] = useState('');
            const [tone, setTone] = useState('professional');
            const [audioFile, setAudioFile] = useState(null);
            const [audioUrl, setAudioUrl] = useState('');
            const [voiceId, setVoiceId] = useState('en_female_1');
            const [loading, setLoading] = useState(false);
            const [result, setResult] = useState(null);
            const [videoStatus, setVideoStatus] = useState(null);
            const [polling, setPolling] = useState(false);

            const voices = [
                { id: 'en_female_1', label: '👩 Female (English)' },
                { id: 'en_male_1', label: '👨 Male (English)' },
                { id: 'en_female_2', label: '👩‍💼 Professional Female' },
                { id: 'en_male_2', label: '👨‍💼 Professional Male' },
            ];

            const tones = [
                { id: 'professional', label: '💼 Professional' },
                { id: 'casual', label: '😊 Casual' },
                { id: 'enthusiastic', label: '🔥 Enthusiastic' },
                { id: 'educational', label: '📚 Educational' },
            ];

            const uploadPhoto = async (file) => {
                const formData = new FormData();
                formData.append('file', file);
                
                const response = await fetch(`${API}/upload-avatar-photo`, {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();
                
                if (data.success) {
                    setPhotoUrl(data.full_url);
                    return data.full_url;
                }
                throw new Error('Upload failed');
            };

            const handlePhotoSelect = async (e) => {
                const file = e.target.files[0];
                if (file) {
                    setPhoto(file);
                    setPhotoPreview(URL.createObjectURL(file));
                    
                    try {
                        setLoading(true);
                        await uploadPhoto(file);
                        setStep(2);
                    } catch (err) {
                        alert('Failed to upload photo');
                    }
                    setLoading(false);
                }
            };

            const generateScript = async () => {
                if (!topic) return;
                setLoading(true);
                
                try {
                    const res = await api.post('/generate-avatar-with-script', {
                        topic,
                        duration: 30,
                        tone,
                        platform: 'instagram'
                    });
                    
                    if (res.success) {
                        setScript(res.script);
                    } else {
                        alert('Failed to generate script');
                    }
                } catch (err) {
                    alert('Script generation failed');
                }
                setLoading(false);
            };

            const uploadAudio = async (file) => {
                const formData = new FormData();
                formData.append('file', file);
                
                const response = await fetch(`${API}/upload-audio`, {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();
                
                if (data.success) {
                    setAudioUrl(data.full_url);
                    return data.full_url;
                }
                throw new Error('Upload failed');
            };

            const handleAudioSelect = async (e) => {
                const file = e.target.files[0];
                if (file) {
                    setAudioFile(file);
                    try {
                        await uploadAudio(file);
                    } catch (err) {
                        alert('Failed to upload audio');
                    }
                }
            };

            const generateAvatar = async () => {
                if (!photoUrl) {
                    alert('Please upload your photo first');
                    return;
                }
                
                if (scriptMode !== 'upload_audio' && !script) {
                    alert('Please add a script or upload audio');
                    return;
                }

                setLoading(true);
                setResult(null);
                setVideoStatus(null);

                try {
                    const payload = {
                        image_url: photoUrl,
                        prompt: 'speaking naturally with a friendly, professional expression, slight head movements',
                        mode: 'std'
                    };

                    if (scriptMode === 'upload_audio' && audioUrl) {
                        payload.audio_url = audioUrl;
                    } else {
                        payload.text = script;
                        payload.voice_id = voiceId;
                    }

                    const res = await api.post('/generate-avatar', payload);

                    if (res.success) {
                        setResult(res);
                        pollVideoStatus(res.task_id);
                    } else {
                        alert('Failed: ' + (res.error || 'Unknown error'));
                    }
                } catch (err) {
                    alert('Avatar generation failed. Check your Kling API key.');
                }
                setLoading(false);
            };

            const pollVideoStatus = async (taskId) => {
                setPolling(true);
                const maxAttempts = 60;
                let attempts = 0;

                const poll = async () => {
                    try {
                        const res = await api.get(`/video-status/${taskId}`);
                        setVideoStatus(res);

                        if (res.status === 'completed' || res.status === 'success' || res.video_url) {
                            setPolling(false);
                            return;
                        } else if (res.status === 'failed' || res.status === 'error') {
                            setPolling(false);
                            return;
                        }

                        attempts++;
                        if (attempts < maxAttempts) {
                            setTimeout(poll, 5000);
                        } else {
                            setPolling(false);
                        }
                    } catch (err) {
                        setPolling(false);
                    }
                };

                poll();
            };

            return (
                <div>

                        <h1 className="page-title">🧑‍💼 Avatar Videos</h1>
                    </div>

                    <div className="grid-2">

                                        </div>
                                    </div>
                                ) : (
                                    <div>
                                        <input type="file" accept="image/*" onChange={handlePhotoSelect} style={{ display: 'none' }} id="photo-upload" />
                                        <label htmlFor="photo-upload" className="btn btn-secondary" style={{ cursor: 'pointer', display: 'inline-flex' }}>
                                            📤 Upload Your Photo
                                        </label>
                                        <p style={{ fontSize: '11px', color: 'var(--text-muted)', marginTop: '8px' }}>
                                            Best: Front-facing, well-lit headshot
                                        </p>
                                    </div>
                                )}
                            </div>

                            {/* Step 2: Script */}
                            <div style={{ marginBottom: '24px', padding: '16px', background: step >= 2 ? 'rgba(139,92,246,0.1)' : 'var(--bg-dark)', borderRadius: '12px', border: step === 2 ? '2px solid var(--accent)' : '1px solid var(--border)', opacity: step < 2 ? 0.5 : 1 }}>
                                <div style={{ fontWeight: '600', marginBottom: '12px' }}>🎙️ Step 2: What Should You Say?</div>
                                
                                <div style={{ display: 'flex', gap: '8px', marginBottom: '16px' }}>
                                    {[['generate', '✨ AI Generate'], ['write', '✍️ Write Script'], ['upload_audio', '🎤 Upload Audio']].map(([id, label]) => (
                                        <button key={id} onClick={() => setScriptMode(id)} disabled={step < 2} style={{
                                            flex: 1, padding: '8px', borderRadius: '8px', fontSize: '11px', cursor: 'pointer',
                                            border: scriptMode === id ? '2px solid var(--accent)' : '1px solid var(--border)',
                                            background: scriptMode === id ? 'rgba(139,92,246,0.2)' : 'transparent', color: 'var(--text)'
                                        }}>
                                            {label}
                                        </button>
                                    ))}
                                </div>

                                {scriptMode === 'generate' && (
                                    <div>
                                        <input type="text" className="form-input" placeholder="Topic: e.g., 3 tips for productivity" value={topic} onChange={e => setTopic(e.target.value)} disabled={step < 2} style={{ marginBottom: '12px' }} />
                                        
                                        <div style={{ display: 'flex', gap: '8px', marginBottom: '12px' }}>
                                            {tones.map(t => (
                                                <button key={t.id} onClick={() => setTone(t.id)} disabled={step < 2} style={{
                                                    flex: 1, padding: '6px', borderRadius: '6px', fontSize: '10px',
                                                    border: tone === t.id ? '2px solid var(--accent)' : '1px solid var(--border)',
                                                    background: tone === t.id ? 'rgba(139,92,246,0.1)' : 'transparent', color: 'var(--text)', cursor: 'pointer'
                                                }}>
                                                    {t.label}
                                                </button>
                                            ))}
                                        </div>

                                        <button className="btn btn-secondary" onClick={generateScript} disabled={loading || !topic || step < 2} style={{ width: '100%' }}>
                                            {loading ? <><div className="spinner" /> Generating...</> : '✨ Generate Script'}
                                        </button>
                                    </div>
                                )}

                                {(scriptMode === 'generate' || scriptMode === 'write') && (
                                    <div style={{ marginTop: '12px' }}>
                                        <textarea className="form-textarea" placeholder="Your script... (what you'll say in the video)" value={script} onChange={e => setScript(e.target.value)} disabled={step < 2} style={{ minHeight: '100px' }} />
                                    </div>
                                )}

                                {scriptMode === 'upload_audio' && (
                                    <div>
                                        <input type="file" accept="audio/*" onChange={handleAudioSelect} style={{ display: 'none' }} id="audio-upload" />
                                        <label htmlFor="audio-upload" className="btn btn-secondary" style={{ cursor: 'pointer', display: 'inline-flex', width: '100%', justifyContent: 'center' }}>
                                            🎤 {audioFile ? audioFile.name : 'Upload Your Voice Recording'}
                                        </label>
                                        {audioUrl && <p style={{ color: 'var(--success)', fontSize: '12px', marginTop: '8px' }}>✅ Audio uploaded</p>}
                                    </div>
                                )}

                                {scriptMode !== 'upload_audio' && script && (
                                    <div style={{ marginTop: '12px' }}>
                                        <div style={{ fontSize: '12px', color: 'var(--text-muted)', marginBottom: '8px' }}>Voice:</div>
                                        <div style={{ display: 'flex', gap: '6px', flexWrap: 'wrap' }}>
                                            {voices.map(v => (
                                                <button key={v.id} onClick={() => setVoiceId(v.id)} style={{
                                                    padding: '6px 10px', borderRadius: '6px', fontSize: '11px',
                                                    border: voiceId === v.id ? '2px solid var(--accent)' : '1px solid var(--border)',
                                                    background: voiceId === v.id ? 'rgba(139,92,246,0.1)' : 'transparent', color: 'var(--text)', cursor: 'pointer'
                                                }}>
                                                    {v.label}
                                                </button>
                                            ))}
                                        </div>
                                    </div>
                                )}
                            </div>

                            {/* Step 3: Generate */}
                            <button className="btn btn-primary" onClick={generateAvatar} disabled={loading || !photoUrl || (scriptMode !== 'upload_audio' && !script) || (scriptMode === 'upload_audio' && !audioUrl)} style={{ width: '100%' }}>
                                {loading ? <><div className="spinner" /> Creating Avatar Video...</> : '🎬 Generate Avatar Video (~$0.10)'}
                            </button>
                        </div>

                        <div className="card">
                            <div className="card-title"><span style={{ display: "inline-flex", verticalAlign: "middle", marginRight: "8px", color: "var(--accent)" }}>{Icons.overview}</span> Preview</div>

                            {result || polling ? (
                                <div>
                                    {photoPreview && (
                                        <div style={{ marginBottom: '16px', textAlign: 'center' }}>
                                            <img src={photoPreview} alt="Your avatar" style={{ width: '120px', height: '120px', borderRadius: '50%', objectFit: 'cover', border: '3px solid var(--accent)' }} />
                                        </div>
                                    )}

                                    <div style={{ background: 'var(--bg-dark)', padding: '16px', borderRadius: '12px' }}>
                                        {polling ? (
                                            <div style={{ textAlign: 'center' }}>
                                                <div className="spinner" style={{ margin: '0 auto 12px' }} />

                                            </div>

                                        )}

                                </div>
                            ) : (
                                <div className="empty-state">
                                    <div className="empty-icon">🧑‍💼</div>
                                    <p>Your avatar video will appear here</p>
                                    <p style={{ fontSize: '12px', marginTop: '8px', color: 'var(--text-muted)' }}>
                                        Upload your photo to get started
                                    </p>
                                </div>
                            )}
                        </div>
                    </div>

                        <div style={{ marginBottom: '16px' }}>
                            <div style={{ fontSize: '12px', color: 'var(--text-muted)', marginBottom: '6px' }}>
                                Kling AI API Key — <a href="https://klingai.com/global/dev" target="_blank" style={{ color: 'var(--accent)' }}>Get key ↗</a>
                                {config?.kling_configured && <span style={{ marginLeft: '8px', color: '#10b981' }}>● Configured</span>}
                            </div>
                            <input
                                type="password"
                                className="form-input"
                                placeholder={config?.kling_configured ? '●●●●●●●● (already set — paste to update)' : 'your-kling-api-key'}
                                value={form.KLING_API_KEY}
                                onChange={e => setForm(f => ({ ...f, KLING_API_KEY: e.target.value }))}
                                style={{ fontSize: '13px' }}
                            />
                        </div>
                        <button className="btn btn-primary" onClick={save} disabled={saving} style={{ minWidth: '120px' }}>
                            {saving ? <><div className="spinner" /> Saving...</> : saved ? '✅ Saved!' : '💾 Save Settings'}
                        </button>
                    </div>
                </div>
            );
        }

        // Accounts Page
        function Accounts({ accounts, onRefresh }) {
            const [modal, setModal] = useState(null);
            const [form, setForm] = useState({ username: '', password: '' });
            const [loading, setLoading] = useState(false);

            const saveAccount = async () => {
                if (!form.username || !form.password) return;
                setLoading(true);
                await api.post('/accounts', {
                    platform: modal,
                    username: form.username,
                    password: form.password
                });
                setModal(null);
                setForm({ username: '', password: '' });
                setLoading(false);
                onRefresh();
            };

            const login = async (platform) => {
                setLoading(true);
                const result = await api.post(`/accounts/${platform}/login`);
                alert(result.message);
                setLoading(false);
                onRefresh();
            };

            const remove = async (platform) => {
                if (confirm(`Disconnect ${platform}?`)) {
                    await api.delete(`/accounts/${platform}`);
                    onRefresh();
                }
            };

            const platforms = [
                { id: 'linkedin', name: 'LinkedIn', desc: 'Professional network' },
                { id: 'instagram', name: 'Instagram', desc: 'Photo & video sharing' },
                { id: 'twitter', name: 'X (Twitter)', desc: 'Real-time updates' }
            ];

            return (
                <div>
                    <div className="header">
                        <h1 className="page-title">Connected Accounts</h1>
                    </div>

                    <div className="card">
                        <div className="card-title">🔐 Your Social Media Accounts</div>
                        <p style={{ color: 'var(--text-muted)', marginBottom: '24px', fontSize: '14px' }}>
                            Add your credentials to enable automated posting. All passwords are encrypted locally.
                        </p>

                        {platforms.map(p => {
                            const account = accounts.find(a => a.platform === p.id);
                            return (
                                <div key={p.id} className="account-item">
                                    <div className="account-info">
                                        <div className={`account-icon ${p.id}`}>{icons[p.id]}</div>
                                        <div>
                                            <div className="account-name">{p.name}</div>
                                            <div className={`account-status ${account?.is_logged_in ? 'connected' : ''}`}>
                                                {account ? (account.is_logged_in ? `● ${account.username}` : `○ ${account.username} (not logged in)`) : p.desc}
                                            </div>
                                        </div>
                                    </div>
                                    <div className="account-actions">
                                        {account ? (
                                            <>
                                                {!account.is_logged_in && (
                                                    <button className="btn btn-primary" onClick={() => login(p.id)} disabled={loading}>
                                                        {loading ? <div className="spinner" /> : '🔓 Login'}
                                                    </button>
                                                )}
                                                <button className="btn btn-danger" onClick={() => remove(p.id)}>Remove</button>
                                            </>
                                        ) : (
                                            <button className={`btn btn-${p.id}`} onClick={() => setModal(p.id)}>
                                                + Add Account
                                            </button>
                                        )}
                                    </div>
                                </div>
                            );
                        })}
                    </div>

                    <div className="card">
                        <div className="card-title">💡 How It Works</div>
                        <div style={{ color: 'var(--text-dim)', lineHeight: '1.8', fontSize: '14px' }}>
                            <p><strong>1. Add your credentials</strong> - Your password is encrypted and stored locally</p>
                            <p><strong>2. Click Login</strong> - A browser window opens for you to complete login</p>
                            <p><strong>3. Handle any verification</strong> - Complete 2FA or security checks if prompted</p>
                            <p><strong>4. You're connected!</strong> - The session is saved for automated posting</p>
                            <br />
                            <p style={{ color: 'var(--text-muted)' }}>
                                ⚠️ Note: Some platforms may require re-login periodically for security reasons.
                            </p>
                        </div>
                    </div>

                    {/* Add Account Modal */}
                    {modal && (
                        <div className="modal-overlay" onClick={() => setModal(null)}>
                            <div className="modal" onClick={e => e.stopPropagation()}>
                                <div className="modal-header">
                                    <h2 className="modal-title">Add {modal.charAt(0).toUpperCase() + modal.slice(1)} Account</h2>
                                    <button className="modal-close" onClick={() => setModal(null)}>✕</button>
                                </div>

                                <div className="form-group">
                                    <label className="form-label">
                                        {modal === 'twitter' ? 'Username or Email' : modal === 'instagram' ? 'Username' : 'Email'}
                                    </label>
                                    <input
                                        type="text"
                                        className="form-input"
                                        value={form.username}
                                        onChange={e => setForm({ ...form, username: e.target.value })}
                                        placeholder={modal === 'linkedin' ? 'email@example.com' : '@username'}
                                    />
                                </div>

                                <div className="form-group">
                                    <label className="form-label">Password</label>
                                    <input
                                        type="password"
                                        className="form-input"
                                        value={form.password}
                                        onChange={e => setForm({ ...form, password: e.target.value })}
                                    />
                                </div>

                                <div style={{ display: 'flex', gap: '12px', marginTop: '24px' }}>
                                    <button className="btn btn-secondary" onClick={() => setModal(null)}>Cancel</button>
                                    <button className="btn btn-primary" onClick={saveAccount} disabled={loading}>
                                        {loading ? <div className="spinner" /> : '🔒 Save & Login'}
                                    </button>
                                </div>

                                <p style={{ marginTop: '16px', fontSize: '12px', color: 'var(--text-muted)' }}>
                                    🔐 Your password is encrypted with AES-256 and stored only on your machine.
                                </p>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // Main App
        
function App() {
    const [tab, setTab] = useState('landing');
    const [posts, setPosts] = useState([]);
    const [accounts, setAccounts] = useState([]);
    const [signals, setSignals] = useState(null);
    const [agentStatus, setAgentStatus] = useState(null);
    const [loading, setLoading] = useState(true);

    const load = async () => {
        try {
            const [postsRes, accountsRes, signalsRes, statusRes] = await Promise.all([
                api.get('/posts').catch(() => ({ posts: [] })),
                api.get('/accounts').catch(() => ({ accounts: [] })),
                api.get('/pipeline/signals').catch(() => null),
                api.get('/pipeline/status').catch(() => null)
            ]);
            setPosts(postsRes.posts || []);
            setAccounts(accountsRes.accounts || []);
            setSignals(
                Array.isArray(signalsRes)
                    ? signalsRes
                    : (signalsRes?.signals || [])
            );
            setAgentStatus(statusRes ? (Array.isArray(statusRes) ? statusRes : (statusRes.agents || [])) : []);
        } catch (err) {
            console.error('Failed to load:', err);
        }
        setLoading(false);
    };

    useEffect(() => { load(); }, []);

    const deletePost = async (id) => {
        if (confirm('Delete this post?')) {
            await api.delete(`/posts/${id}`);
            load();
        }
    };

    const publishPost = async (id) => {
        await api.post(`/posts/${id}/publish`);
        load();
    };

    if (loading) {
        return (
            <div className="loading-center" style={{ height: '100vh', background: 'var(--bg-dark)' }}>
                <div className="spinner" style={{ width: '40px', height: '40px' }} />
                <p>Initializing Nexus CMO...</p>
            </div>
        );
    }

    if (tab === 'landing') {
        return (
            <div className="app">
                <div className="cinematic-bg"></div>
                <main className="main landing-mode">
                    <Landing onEnter={() => setTab('dashboard')} />
                </main>
            </div>
        );
    }

    return (
        <div className="app">
            <div className="cinematic-bg"></div>
            <Sidebar active={tab} onChange={setTab} />
            <main className="main">
                {tab === 'dashboard' && <CommandCenter posts={posts} accounts={accounts} signals={signals} agentStatus={agentStatus} />}
                {tab === 'opportunity' && <OpportunityRadar signals={signals} />}
                {tab === 'network' && <AgentNetwork agentStatus={agentStatus} />}
                {tab === 'create' && <CreateContent onCreated={load} accounts={accounts} />}
                {tab === 'carousel' && <CarouselMaker onCreated={load} />}
                {tab === 'video' && <VideoMaker onCreated={load} />}
                {tab === 'avatar' && <AvatarMaker onCreated={load} />}
                {tab === 'posts' && <PostsList posts={posts} onDelete={deletePost} onPublish={publishPost} />}
                {tab === 'performance' && <Analytics />}
                {tab === 'accounts' && <Accounts accounts={accounts} onRefresh={load} />}
                {tab === 'settings' && <Settings />}
            </main>
        </div>
    );
}

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
